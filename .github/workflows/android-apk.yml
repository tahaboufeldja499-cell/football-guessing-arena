# يبني ملف APK على خوادم GitHub (بدون Android Studio). التشغيل: تبويب Actions ← Build Android APK ← Run workflow
# الإعداد مرة واحدة: Settings ← Secrets and variables ← Actions ← أضف:
#   Secrets:  NEXT_PUBLIC_SUPABASE_URL  و  NEXT_PUBLIC_SUPABASE_ANON_KEY
#   Variables (اختياري): NEXT_PUBLIC_SITE_URL  (رابط موقعك المنشور لروابط الدعوة)
name: Build Android APK
on:
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run app:init
      - run: npm run app:apk
      - uses: actions/upload-artifact@v4
        with: { name: football-arena-apk, path: football-arena.apk }
